environment: dev

kafka:
  bootstrap_servers: localhost:9092
  topic: vehicle-events
  starting_offsets: earliest

postgres:
  host: localhost
  port: 5432
  database: enterprise
  username: postgres
  password: postgres

storage:
  bronze_table: bronze_vehicle
  silver_table: silver_vehicle
  gold_table: gold_vehicle

checkpoint:
  bronze: checkpoints/bronze
  silver: checkpoints/silver
  gold: checkpoints/gold

s3:
  bucket: enterprise-dev
