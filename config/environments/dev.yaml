environment: dev

kafka:
  bootstrap_servers: localhost:9092
  topic: vehicle-events
  starting_offsets: earliest

postgres:
  host: localhost
  port: 5432
  database: vehicle_platform
  username: postgres

storage:
  bronze_table: bronze.vehicle_events
  silver_table: silver.vehicle_events
  gold_table: vehicle_metrics

checkpoint:
  bronze: checkpoints/bronze
  silver: checkpoints/silver
  gold: checkpoints/gold
