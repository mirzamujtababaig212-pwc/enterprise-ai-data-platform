pipeline:
  class: bronze

reader:
  type: kafka
  options: kafka

writer:
  type: delta
  table: BRONZE_TABLE
  path: BRONZE_PATH
  mode: append
  glue_database_name: enterprise_ai_platform
  glue_table_name: vehicle_events

runtime:
  checkpoint: BRONZE_CHECKPOINT
  output_mode: append
  retries: 3
  retry_delay: 2
  enable_validation: true
  enable_metrics: true
  enable_dlq: true

transformer:
  type: bronze

validator:
  type: composite
  schema:
    - kafka_key
    - kafka_topic
    - kafka_partition
    - kafka_offset
    - kafka_timestamp
    - raw_value
    - vehicle_id
    - event_time
    - latitude
    - longitude
    - speed
    - rpm
    - fuel_level
    - battery
    - engine_temperature
    - gear
    - ingestion_time

  required:
    - vehicle_id
    - event_time

  duplicate_keys:
    - vehicle_id
    - event_time

metrics:
  type: default

dlq:
  type: delta
  table: BRONZE_DLQ_TABLE
