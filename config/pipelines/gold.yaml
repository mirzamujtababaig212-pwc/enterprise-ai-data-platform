pipeline:
  class: gold

reader:
  type: delta
  table: SILVER_TABLE
  path: SILVER_PATH

writer:
  type: delta
  table: GOLD_TABLE
  path: GOLD_PATH
  mode: overwrite
  glue_database_name: enterprise_ai_platform
  glue_table_name: vehicle_metrics

runtime:
  output_mode: append
  retries: 3
  retry_delay: 2
  enable_validation: false
  enable_metrics: true
  enable_dlq: false

transformer:
  type: gold

validator:
  type: noop

metrics:
  type: default

dlq:
  type: noop
