pipeline:
  class: silver

reader:
  type: parquet
  path: BATCH_BRONZE_PATH

writer:
  type: delta
  table: SILVER_TABLE
  path: SILVER_PATH
  mode: append

runtime:
  checkpoint: SILVER_CHECKPOINT
  output_mode: append
  retries: 3
  retry_delay: 2
  enable_validation: true
  enable_metrics: true
  enable_dlq: true

transformer:
  type: silver

validator:
  type: default

metrics:
  type: default

dlq:
  type: default
