pipeline:
  class: silver

reader:
  type: delta
  table: BRONZE_TABLE
  path: BRONZE_PATH

writer:
  type: delta
  table: SILVER_TABLE
  path: SILVER_PATH
  mode: merge
  merge_keys:
    - vehicle_id
    - event_time
  glue_database_name: enterprise_ai_platform
  glue_table_name: vehicle_events_silver

runtime:
  checkpoint: SILVER_CHECKPOINT
  output_mode: append
  retries: 3
  retry_delay: 2
  enable_validation: true
  enable_metrics: true
  enable_dlq: true

transformer:
  type: silver

validator:
  type: default

metrics:
  type: default

dlq:
  type: default
