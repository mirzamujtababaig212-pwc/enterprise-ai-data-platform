services:
  # ============================================================
  # Enterprise AI Platform Application
  # ============================================================
  enterprise-ai-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-ai-platform
    depends_on:
      kafka:
           condition: service_started
      postgres:
           condition: service_healthy
      prometheus:
           condition: service_started
      jaeger:
           condition: service_started
    volumes:
      - .:/app
    environment:
      PYTHONPATH: /app
      # --------------------------------------------------------
      # Authentication
      # --------------------------------------------------------
      API_KEY: ${API_KEY}

      # --------------------------------------------------------
      # LLM Providers
      # --------------------------------------------------------
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # --------------------------------------------------------
      # Kafka
      # --------------------------------------------------------
      KAFKA_BROKER: ${KAFKA_BROKER:-kafka:29092}
      # --------------------------------------------------------
      # PostgreSQL
      # --------------------------------------------------------
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai}
      POSTGRES_USER: ${POSTGRES_USER:-enterprise_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enterprise_ai}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # --------------------------------------------------------
      # OpenTelemetry
      # --------------------------------------------------------
      OTEL_SERVICE_NAME: enterprise-ai-platform
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # --------------------------------------------------------
      # Environment
      # --------------------------------------------------------
      ENVIRONMENT: ${ENVIRONMENT:-local}
    command: >
      uvicorn ai_platform.llm_gateway.api.main:app
      --host 0.0.0.0
      --port 8000
    stdin_open: true
    tty: true
    ports:
      - "8000:8000"
    restart: unless-stopped


  # ============================================================
  # Zookeeper
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped


  # ============================================================
  # Kafka
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      zookeeper:
           condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: |
        PLAINTEXT:PLAINTEXT
        PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: |
        PLAINTEXT://kafka:29092
        PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: |
        PLAINTEXT://0.0.0.0:29092
        PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped


  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai}
      POSTGRES_USER: ${POSTGRES_USER:-enterprise_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enterprise_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vehicle_db}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ============================================================
  # Spark Master
  # ============================================================
  spark-master:
    image: apache/spark:3.5.6
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8081:8080"
    restart: unless-stopped


  # ============================================================
  # Spark Worker
  # ============================================================
  spark-worker:
    image: apache/spark:3.5.6
    container_name: spark-worker
    depends_on:
      spark-master:
        condition: service_started
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
    restart: unless-stopped


  # ============================================================
  # MinIO
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped


  # ============================================================
  # Prometheus
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      jaeger:
        condition: service_started
    restart: unless-stopped


  # ============================================================
  # Grafana
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped


  # ============================================================
  # Jaeger
  # ============================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped


# ==============================================================
# Persistent Volumes
# ==============================================================
volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
