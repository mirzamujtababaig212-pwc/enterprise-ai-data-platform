name: Python CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev,ragas]"
          python -m pip install black==26.5.1 flake8==7.2.0

      - name: Run Black on changed Python files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            if git rev-parse "${HEAD_SHA}^" >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
            else
              mapfile -t changed_files < <(git ls-files '*.py')
              BASE_SHA=""
            fi
          fi

          if [[ -n "$BASE_SHA" ]]; then
            mapfile -d '' -t changed_files < <(
              git diff --name-only -z --diff-filter=ACMRT \
                "$BASE_SHA" "$HEAD_SHA" -- '*.py'
            )
          fi

          existing_files=()
          for file in "${changed_files[@]}"; do
            if [[ -f "$file" ]]; then
              existing_files+=("$file")
            fi
          done

          if (( ${#existing_files[@]} > 0 )); then
            black --check "${existing_files[@]}"
          else
            echo "No changed Python files to format-check."
          fi

      - name: Run Flake8
        run: |
          flake8

      - name: Run service-independent tests
        run: |
          pytest --cov --ignore=tests/integration
