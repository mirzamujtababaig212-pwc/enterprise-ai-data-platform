name: Enterprise AI Platform CI

on:
  push:
    branches:
      - main
      - develop
      - master

  pull_request:
    branches:
      - main
      - develop
      - master

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      - name: Verify tool versions
        run: |
          python --version
          pip --version
          pytest --version
          ruff --version
          black --version
          mypy --version

      # Staged rollout: lint changed Python files only.
      # This does not establish that the entire repository is Ruff-clean.
      - name: Run Ruff on changed Python files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
          fi

          # Handle a first push, where the previous SHA can be all zeroes.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            if git rev-parse "${HEAD_SHA}^" >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
            else
              echo "No parent commit available; linting all tracked Python files."
              mapfile -t changed_files < <(git ls-files '*.py')
              BASE_SHA=""
            fi
          fi

          if [[ -n "$BASE_SHA" ]]; then
            mapfile -d '' -t changed_files < <(
              git diff --name-only -z --diff-filter=ACMRT \
                "$BASE_SHA" "$HEAD_SHA" -- '*.py'
            )
          fi

          existing_files=()
          for file in "${changed_files[@]}"; do
            if [[ -f "$file" ]]; then
              existing_files+=("$file")
            fi
          done

          if (( ${#existing_files[@]} > 0 )); then
            printf 'Running Ruff on %s changed Python file(s).\n' \
              "${#existing_files[@]}"
            ruff check "${existing_files[@]}"
            black --check "${existing_files[@]}"
          else
            echo "No changed Python files to lint; Ruff and Black checks skipped."
          fi

      - name: Run tests
        run: |
          pytest -q

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=ai_platform \
            --cov=common \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  mlflow-integration:
    name: MLflow and S3 Artifact Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      - name: Create isolated Docker network
        run: docker network create ci-mlflow-net

      - name: Start MinIO
        run: |
          docker run -d \
            --name ci-minio \
            --network ci-mlflow-net \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=minio123 \
            docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z \
            server /data

      - name: Wait for MinIO and create artifact bucket
        run: |
          set -euo pipefail

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent \
              http://localhost:9000/minio/health/live >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            docker logs ci-minio
            echo "MinIO did not become healthy."
            exit 1
          fi

          python - <<'PYBUCKET'
          import boto3

          client = boto3.client(
              "s3",
              endpoint_url="http://localhost:9000",
              aws_access_key_id="minio",
              aws_secret_access_key="minio123",
              region_name="us-east-1",
          )
          client.create_bucket(Bucket="mlflow-artifacts")
          client.head_bucket(Bucket="mlflow-artifacts")
          print("MLflow artifact bucket is ready.")
          PYBUCKET

      - name: Build MLflow image
        run: |
          docker build \
            -f docker/Dockerfile.mlflow \
            -t enterprise-ai-platform-mlflow:ci \
            .

      - name: Start MLflow
        run: |
          docker volume create ci-mlflow-data

          docker run -d \
            --name ci-mlflow \
            --network ci-mlflow-net \
            -p 5051:5000 \
            -v ci-mlflow-data:/mlflow \
            -e MLFLOW_S3_ENDPOINT_URL=http://ci-minio:9000 \
            -e AWS_ACCESS_KEY_ID=minio \
            -e AWS_SECRET_ACCESS_KEY=minio123 \
            -e AWS_DEFAULT_REGION=us-east-1 \
            enterprise-ai-platform-mlflow:ci \
            mlflow server \
              --host 0.0.0.0 \
              --port 5000 \
              --backend-store-uri sqlite:///mlflow/mlflow.db \
              --default-artifact-root s3://mlflow-artifacts/ \
              --allowed-hosts "*"

      - name: Wait for MLflow
        run: |
          set -euo pipefail

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent \
              http://localhost:5051/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            docker logs ci-mlflow
            echo "MLflow did not become healthy."
            exit 1
          fi

      - name: Run live MLflow and S3 lifecycle test
        env:
          RUN_MLFLOW_INTEGRATION: "1"
          MLFLOW_TRACKING_URI: http://localhost:5051
          MLFLOW_S3_ENDPOINT_URL: http://localhost:9000
          AWS_ACCESS_KEY_ID: minio
          AWS_SECRET_ACCESS_KEY: minio123
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python -m pytest -q tests/integration/test_mlflow.py

      - name: Collect service logs on failure
        if: failure()
        run: |
          docker logs ci-minio || true
          docker logs ci-mlflow || true

      - name: Clean up integration services
        if: always()
        run: |
          docker rm -f ci-mlflow ci-minio || true
          docker volume rm ci-mlflow-data || true
          docker network rm ci-mlflow-net || true

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Run MyPy
        run: |
          mypy ai_platform

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --tag enterprise-ai-platform:${{ github.sha }} \
            .

      - name: Verify Docker image
        run: |
          docker image inspect enterprise-ai-platform:${{ github.sha }}

  rag-release-gate:
    name: RAG Release Gate
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Run RAG release evaluation
        run: |
          python scripts/run_rag_release_evaluation.py
