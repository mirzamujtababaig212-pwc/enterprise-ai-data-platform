name: Enterprise AI Platform CI

on:
  push:
    branches:
      - main
      - develop
      - master

  pull_request:
    branches:
      - main
      - develop
      - master

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Verify tool versions
        run: |
          python --version
          pip --version
          pytest --version
          ruff --version
          black --version
          mypy --version

      # Staged rollout: lint changed Python files only.
      # This does not establish that the entire repository is Ruff-clean.
      - name: Run Ruff on changed Python files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
          fi

          # Handle a first push, where the previous SHA can be all zeroes.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            if git rev-parse "${HEAD_SHA}^" >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
            else
              echo "No parent commit available; linting all tracked Python files."
              mapfile -t changed_files < <(git ls-files '*.py')
              BASE_SHA=""
            fi
          fi

          if [[ -n "$BASE_SHA" ]]; then
            mapfile -d '' -t changed_files < <(
              git diff --name-only -z --diff-filter=ACMRT \
                "$BASE_SHA" "$HEAD_SHA" -- '*.py'
            )
          fi

          existing_files=()
          for file in "${changed_files[@]}"; do
            if [[ -f "$file" ]]; then
              existing_files+=("$file")
            fi
          done

          if (( ${#existing_files[@]} > 0 )); then
            printf 'Running Ruff on %s changed Python file(s).\n' \
              "${#existing_files[@]}"
            ruff check "${existing_files[@]}"
          else
            echo "No changed Python files to lint; Ruff check skipped."
          fi

      - name: Run Black
        run: |
          black --check .

      - name: Run tests
        run: |
          pytest -q

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=ai_platform \
            --cov=common \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Run MyPy
        run: |
          mypy ai_platform

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --tag enterprise-ai-platform:${{ github.sha }} \
            .

      - name: Verify Docker image
        run: |
          docker image inspect enterprise-ai-platform:${{ github.sha }}

  rag-release-gate:
    name: RAG Release Gate
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Run RAG release evaluation
        run: |
          python scripts/run_rag_release_evaluation.py
