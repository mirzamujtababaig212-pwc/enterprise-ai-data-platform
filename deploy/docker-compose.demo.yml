services:

  llm-gateway:
    build:
      context: ..
      dockerfile: deploy/docker/llm-gateway.Dockerfile

    ports:
      - "8000:8000"

    environment:
      ENVIRONMENT: demo
      SERVICE_NAME: enterprise-ai-llm-gateway
      SERVICE_VERSION: "0.1.0"
      LOG_LEVEL: INFO
      ENABLE_METRICS: "true"
      ENABLE_TRACING: "true"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]

      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      llm-gateway:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    restart: unless-stopped
